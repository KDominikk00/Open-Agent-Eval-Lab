[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-eval-lab"
version = "0.1.0"
description = "Benchmark harness for evaluating tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Open Agent Eval Lab" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
open-agent-eval = "open_agent_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
