[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-eval-lab"
version = "0.4.0"
description = "Benchmark harness for evaluating tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Open Agent Eval Lab" }]
license = { text = "MIT" }
dependencies = []
keywords = ["llm", "agents", "benchmark", "evaluation", "leaderboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
open-agent-eval = "open_agent_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_agent_eval = ["py.typed"]
