name: Deploy Leaderboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Build benchmark runs
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          PYTHONPATH=src python -m open_agent_eval.cli validate --tasks-dir tasks --split all
          PYTHONPATH=src python -m open_agent_eval.cli run \
            --tasks-dir tasks \
            --output-dir results-pages \
            --agent echo-reference \
            --split public \
            --run-id pages-public-${TS}
          PYTHONPATH=src python -m open_agent_eval.cli run \
            --tasks-dir tasks \
            --output-dir results-pages \
            --agent tool-hint \
            --split hidden \
            --run-id pages-hidden-${TS}

      - name: Generate leaderboard site
        run: |
          PYTHONPATH=src python -m open_agent_eval.cli leaderboard --results-dir results-pages --output-dir site
          cp site/leaderboard.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
