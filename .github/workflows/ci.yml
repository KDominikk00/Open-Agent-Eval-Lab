name: CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate benchmark tasks
        run: PYTHONPATH=src python -m open_agent_eval.cli validate --tasks-dir tasks --split all
      - name: Run smoke benchmark
        run: |
          PYTHONPATH=src python -m open_agent_eval.cli run \
            --tasks-dir tasks \
            --output-dir results-ci \
            --agent instruction-snippet \
            --split public \
            --max-tasks 3 \
            --label smoke \
            --run-id run-ci-smoke
      - name: Offline multi-trial episode run
        run: |
          PYTHONPATH=src python -m open_agent_eval.cli run \
            --tasks-dir tasks \
            --output-dir results-ci \
            --agent random \
            --split all \
            --trials 3 \
            --label smoke \
            --run-id run-ci-random
      - name: Build smoke leaderboard
        run: PYTHONPATH=src python -m open_agent_eval.cli leaderboard --results-dir results-ci --output-dir leaderboard-ci --include-smoke
