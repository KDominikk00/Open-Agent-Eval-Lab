<text x="180" y="119.0" font-size="13" text-anchor="end" fill="#1c2530">echo-reference</text>
<rect x="190" y="106.0" width="123.9" height="18" rx="3" fill="#c2641b"/>
<line x1="255.8" y1="115.0" x2="397.6" y2="115.0" stroke="#1c2530" stroke-width="2"/>
