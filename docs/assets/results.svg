<text x="682" y="119.0" font-size="13" font-weight="600" fill="#1c2530">25.8%</text>
<text x="180" y="157.0" font-size="13" text-anchor="end" fill="#1c2530">keyword-retriever</text>
<rect x="190" y="144.0" width="92.9" height="18" rx="3" fill="#c2641b"/>
<line x1="234.1" y1="153.0" x2="364.1" y2="153.0" stroke="#1c2530" stroke-width="2"/>
<line x1="234.1" y1="147.0" x2="234.1" y2="159.0" stroke="#1c2530" stroke-width="2"/>
