<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Pass rate by agent on the public split</title>
<desc id="d">Horizontal bars show pass rate; whiskers show the 95% Wilson interval over tasks.</desc>
<rect width="760" height="338" rx="10" fill="#ffffff" stroke="#d8dce0"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1c2530">Pass rate by agent (public split, 31 tasks)</text>
<text x="20" y="48" font-size="12" fill="#5b6673">Bar = pass rate. Whisker = 95% Wilson interval over tasks.</text>
<line x1="190.0" y1="52" x2="190.0" y2="286" stroke="#eceff1"/>
<text x="190.0" y="304" font-size="11" text-anchor="middle" fill="#5b6673">0%</text>
<line x1="310.0" y1="52" x2="310.0" y2="286" stroke="#eceff1"/>
<text x="310.0" y="304" font-size="11" text-anchor="middle" fill="#5b6673">25%</text>
<line x1="430.0" y1="52" x2="430.0" y2="286" stroke="#eceff1"/>
<text x="430.0" y="304" font-size="11" text-anchor="middle" fill="#5b6673">50%</text>
<line x1="550.0" y1="52" x2="550.0" y2="286" stroke="#eceff1"/>
<text x="550.0" y="304" font-size="11" text-anchor="middle" fill="#5b6673">75%</text>
<line x1="670.0" y1="52" x2="670.0" y2="286" stroke="#eceff1"/>
<text x="670.0" y="304" font-size="11" text-anchor="middle" fill="#5b6673">100%</text>
<text x="180" y="81.0" font-size="13" text-anchor="end" fill="#1c2530">oracle</text>
<rect x="190" y="68.0" width="480.0" height="18" rx="3" fill="#c2641b"/>
<line x1="617.1" y1="77.0" x2="670.0" y2="77.0" stroke="#1c2530" stroke-width="2"/>
<line x1="617.1" y1="71.0" x2="617.1" y2="83.0" stroke="#1c2530" stroke-width="2"/>
